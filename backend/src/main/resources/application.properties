spring.application.name=leetcode-platform

# Database
spring.datasource.url=jdbc:postgresql://ep-silent-dew-ayb8vrdp-pooler.c-5.us-east-2.aws.neon.tech/neondb?sslmode=require
spring.datasource.username=${DB_USERNAME:neondb_owner}
spring.datasource.password=${DB_PASSWORD:npg_u6pn4vGdXgRk}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT
app.jwt.secret=${JWT_SECRET:mySecretKey1234567890123456789012345678901234567890}
app.jwt.expiration=${JWT_EXPIRATION:86400000}

# Sandbox
sandbox.docker.image=${SANDBOX_IMAGE:leetcode-sandbox:latest}
sandbox.timeout.seconds=${SANDBOX_TIMEOUT:5}
sandbox.memory.limit=${SANDBOX_MEMORY:256m}
sandbox.cpu.quota=${SANDBOX_CPU:50000}

# File Upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# CORS
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000}

server.port=8080
